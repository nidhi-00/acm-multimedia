[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verifyhinglish-demo"
version = "0.1.0"
description = "Mock-first Gradio demo for VerifyHinglish"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gradio==6.26.0",
    "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
real = [
    "easyocr==1.7.2",
    "numpy>=1.26,<2",
    "sentence-transformers==3.4.1",
    "torch==2.6.0",
    "transformers>=4.45,<5",
]

[project.scripts]
verifyhinglish-demo = "demo.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"demo.ui" = ["*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
